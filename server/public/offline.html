<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chitrakavyam Maintenance</title>
  <style>
    :root {
      --bg: #0f0e0d;
      --panel: #1a1714;
      --gold: #c8962a;
      --warm: #e8b86d;
      --text: #f2ede8;
      --muted: #8a7f74;
      --border: #2e2924;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #201b16, var(--bg));
      color: var(--text);
      font-family: "DM Sans", system-ui, sans-serif;
    }
    .card {
      width: min(560px, 92vw);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-family: "Cormorant Garamond", serif;
      font-size: 44px;
      color: var(--gold);
    }
    p { margin: 0 0 12px; color: var(--muted); }
    a { color: var(--warm); text-decoration: none; }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warm);
      box-shadow: 0 0 0 rgba(232, 184, 109, 0.6);
      animation: pulse 1.8s infinite;
      margin-right: 8px;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(232, 184, 109, 0.6); }
      100% { box-shadow: 0 0 0 16px rgba(232, 184, 109, 0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>We'll Be Back Shortly</h1>
    <p><span class="dot"></span>Chitrakavyam is temporarily offline for maintenance.</p>
    <p>Please check back in a few minutes.</p>
    <p style="margin-top: 18px; font-size: 13px;">
      Developed by <a href="https://shuvam-banerji-seal.github.io/" target="_blank" rel="noreferrer">Shuvam Banerji Seal</a>
    </p>
  </div>
</body>
</html>
